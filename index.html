<script>
// Self-update: GitHub Pages lets browsers keep this page for up to 10 minutes, so ask for the latest version number
// (never cached) and reload once if this copy is older. Bump BUILD here and in version.txt together on each release.
(function () {
  var BUILD = '37';
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : BUILD; }).then(function (v) {
    v = String(v).trim();
    if (v && v !== BUILD && sessionStorage.getItem('spartan_reloaded') !== v) {
      sessionStorage.setItem('spartan_reloaded', v);
      var u = new URL(location.href);
      u.searchParams.set('v', v);
      location.replace(u.toString());
    }
  }).catch(function () { });
})();
</script>
